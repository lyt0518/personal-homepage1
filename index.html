<!DOCTYPE html>  <!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN">  <!-- 定义网页语言为中文 -->
<head>
    <meta charset="UTF-8">  <!-- 设置字符编码为 UTF-8，避免中文乱码 -->
    <title>我的个人主页</title>  <!-- 网页标题，显示在浏览器标签栏 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入自定义CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">我的主页</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <!-- 1. 个人简介：用 h1-h6 标签区分标题层级 -->
                <h1 id="main title">个人简介</h1>
                <h2 class="section-title">姓名：李燕婷</h2>
                <h3>专业：信息管理与信息系统</h3>
                <h4>兴趣爱好：编程、阅读、羽毛球</h4>

                <!-- 2. 项目经历：无序列表 <ul>+<li>，用于展示非排序内容 -->
                <h2 class="section-title">项目经历</h2>
                <ul class="list-group">
                    <li class="list-group-item">课程设计：学生成绩管理系统（使用 Java+MySQL 开发，负责数据库设计）</li>
                    <li class="list-group-item">个人项目：简易计算器（使用 HTML+CSS+JavaScript 开发，实现加减乘除功能）</li>
                </ul>
            </div>
            <!-- 3. 技能清单：有序列表 <ol>+<li>，用于展示有优先级/顺序的内容 -->
            <div class="col-md-4">
                <h2 class="section-title">技能清单</h2>
                <ol>
                    <li>编程语言：Java、Python、HTML/CSS</li>
                    <li>工具技能：Git 版本控制、MySQL 数据库、IDEA 开发工具</li>
                    <li>其他技能：基础的 Linux 命令、文档撰写</li>
                </ol>

                <!-- 4. 联系方式：<p> 标签定义段落，<a> 标签实现可点击链接（mailto: 协议用于打开邮件客户端） -->
                <h2 class="section-title">联系方式</h2>
                <p>邮箱：<a href="mailto:2307892639@qq.com" class="btn btn-primary">邮件联系我</a></p>

                <!-- 5. 图片展示：<img> 标签插入图片，src 为图片路径（本地图片需放在项目文件夹中），alt 为图片加载失败时的替代文本 -->
                <h2 class="section-title">个人照片</h2>
                <img src="5b99ef29efb16614562112a45745f893.jpg" alt="我的个人照片" width="300">  <!-- width 控制图片宽度，单位为像素 -->
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
